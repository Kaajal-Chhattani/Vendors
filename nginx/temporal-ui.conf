server {
    listen 80;
    absolute_redirect off;  # keep the browser on the published port (8080)

    # Login page and session check live in the auth service; Django holds the users.
    location /_tauth/ {
        proxy_pass http://temporal_auth:8000;
        proxy_set_header Cookie $http_cookie;
    }

    location = /_tauth_check {
        internal;
        proxy_pass              http://temporal_auth:8000/_tauth/check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    location @login {
        return 302 /_tauth/login?next=$request_uri;
    }

    location / {
        auth_request /_tauth_check;
        error_page 401 = @login;

        proxy_pass         http://temporal:8233;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Floating "Log out" link added to the Temporal UI page (needs an uncompressed response).
        proxy_set_header   Accept-Encoding "";
        sub_filter_once    on;
        sub_filter         '</body>' '<a href="/_tauth/logout" style="position:fixed;right:16px;bottom:16px;z-index:99999;padding:8px 14px;background:#2563eb;color:#fff;border-radius:999px;font:600 13px -apple-system,Segoe UI,sans-serif;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.2)">Log out</a></body>';
    }
}
