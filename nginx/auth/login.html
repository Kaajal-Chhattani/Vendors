<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Temporal</title>
<style>
  :root { --accent: #2563eb; --line: #d9dde3; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fb; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(380px, calc(100% - 32px)); padding: 32px 28px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2em; }
  h1 { margin: 0; font-size: 1.15em; }
  .sub { margin: 2px 0 0; font-size: 0.85em; color: var(--muted); }
  label { display: block; margin: 14px 0 6px; font-size: 0.85em; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
  .pw { position: relative; }
  .pw input { padding-right: 64px; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--muted); font: inherit; font-size: 0.82em; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .pw button:hover { background: #f1f3f6; color: #1f2937; }
  .submit { width: 100%; margin-top: 22px; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .submit:hover { background: #1d4ed8; }
  .error { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 0.88em; }
</style>
</head>
<body>
<form class="card" method="post" action="/_tauth/login">
  <div class="brand">
    <div class="logo">T</div>
    <div><h1>Temporal</h1><p class="sub">Sign in with your account</p></div>
  </div>
  <input type="hidden" name="next" value="{{next}}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <div class="pw">
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="button" id="toggle" aria-label="Show password">Show</button>
  </div>
  {{error}}
  <button class="submit" type="submit">Sign in</button>
</form>
<script>
  const pw = document.getElementById('password'), toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
</script>
</body>
</html>
