services:
  temporal:
    image: temporalio/temporal:latest
    container_name: vendors_temporal
    user: "0:0"  # the named volume is root-owned; the image's default user can't write the SQLite file there
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
    expose:
      - "8233"  # UI is reachable only through nginx (login page)
    volumes:
      - temporal_data:/data

  temporal_ui_proxy:
    image: nginx:1.27-alpine
    container_name: vendors_temporal_ui_proxy
    depends_on:
      - temporal
      - temporal_auth
    ports:
      - "8080:80"
    volumes:
      - ./nginx/temporal-ui.conf:/etc/nginx/conf.d/default.conf:ro

  temporal_auth:
    build: ./nginx/auth
    container_name: vendors_temporal_auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TEMPORAL_AUTH_SECRET: ${TEMPORAL_AUTH_SECRET:?set TEMPORAL_AUTH_SECRET in .env}
      TEMPORAL_AUTH_DJANGO_SECRET: ${TEMPORAL_AUTH_DJANGO_SECRET:?set TEMPORAL_AUTH_DJANGO_SECRET in .env}
      DJANGO_AUTH_URL: ${DJANGO_AUTH_URL:-http://host.docker.internal:8000/chat/api/temporal-auth/}

volumes:
  temporal_data:
