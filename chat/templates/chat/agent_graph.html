<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ label }} — Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { margin-bottom: 0; }
        p.description { color: #555; margin-top: 4px; }
        #graph { border: 1px solid #ddd; border-radius: 6px; padding: 20px; margin-top: 20px; overflow: auto; }
        a.back { display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>{{ label }}</h1>
    <p class="description">{{ description }}</p>
    <div id="graph">
        <pre class="mermaid">
{{ mermaid|safe }}
        </pre>
    </div>
    <a class="back" href="{% url 'chat:chat-page' %}">&larr; Back to chat</a>
    <script>
        mermaid.initialize({ startOnLoad: true });
    </script>
</body>
</html>
